name: Pages

# Public demo of web v2 on GitHub Pages with the SYNTHETIC example release (every page shows a "Sample data" banner).
# Deployment is run by the maintainer (owner pre-authorised Pages + public releases). A real release replaces
# web/dist/data with `uv run atlas publish --site web/dist` instead of `npm run stage:demo`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (Pages site + offline template)
        run: npm run build
      - name: Demo data — synthetic sample release, labelled on every page
        run: npm run stage:demo -- dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
