# ============================================================
# TCI Research Atlas — Pipeline configuration (v2)
# คัดลอกเป็น config.yaml แล้วแก้ตามสภาพแวดล้อม — key ที่ไม่รู้จักจะถูกปฏิเสธ (กันพิมพ์ผิด)
# ============================================================

pipeline:
  name: tci-research-atlas
  work_dir: ./work            # checkpoint ที่สร้างใหม่ได้ — ลบทิ้งได้เสมอ
  output_dir: ./output        # ผลลัพธ์สำหรับเว็บ/นักวิเคราะห์
  state_dir: ./state          # ข้อมูลถาวรข้ามรอบ: embedding store, label cache, รอบก่อน — ห้ามลบ
  seed: 42
  release: null               # ชื่อรอบข้อมูล เช่น 2026Q4 — null = ไตรมาสของวันที่รัน (YYYYQn); state แยกตามรอบ

input:
  format: corpus_jsonl        # corpus_jsonl = คลังรูปแบบ 1.0 (แนะนำ — docs/corpus/README.md) | thaijo_md = โฟลเดอร์ไฟล์ .md จาก ThaiJO | table = csv/json/jsonl/parquet ไฟล์เดียว (ไม่ใส่ = thaijo_md)
  path: ../corpus             # โฟลเดอร์คลัง (มี articles/ + journals.csv) หรือโฟลเดอร์ .md (หรือไฟล์ตารางถ้า format: table)
  glob: "**/*.md"             # ใช้เฉพาะ thaijo_md
  corpus_glob: "articles/**/*.jsonl*"   # ใช้เฉพาะ corpus_jsonl: ไฟล์ข้อมูลใต้ path (.jsonl หรือ .jsonl.gz)
  exclude_article_types: [editorial, erratum, book-review]   # ใช้เฉพาะ corpus_jsonl: ประเภทที่ไม่ใช่ผลงานวิจัย — ตัดออกและนับไว้ในรายงาน
  workers: 4                  # จำนวน process ตอน parse (ใช้เมื่อไฟล์ > 2,000)
  batch_files: 20000          # parse ทีละกี่ไฟล์แล้วแปลงเป็นตารางทันที (คุม RAM ที่ 500K ไฟล์)
  max_error_ratio: 0.01       # สัดส่วนไฟล์ที่อ่าน/parse ไม่ได้ที่ยอมรับได้ (เกินนี้ ingest หยุดด้วย error — ดู work/01_ingest_errors); 0 = ห้ามพลาดแม้แต่ไฟล์เดียว
  min_year: 1990              # ตัดปีผิดปกติ (หลังแปลง พ.ศ.→ค.ศ.)
  max_year: null              # null = ปีปัจจุบัน + 1
  columns:                    # ใช้เฉพาะ format: table — ชื่อคอลัมน์มาตรฐาน: ชื่อคอลัมน์ในไฟล์
    article_id: id
    title_th: title_th
    title_en: title_en
    abstract_th: abstract_th
    abstract_en: abstract_en
    keywords_th: keywords_th
    keywords_en: keywords_en
    authors: authors
    affiliations: affiliations
    journal_name: journal
    year: year
    doi: doi
    url: url
  dedup:
    enabled: true             # ตัดซ้ำด้วย article_id → DOI → ชื่อเรื่อง+ปี (เก็บ record ที่ครบที่สุด)

embedding:
  provider: local             # local = BGE-M3 บนเครื่องเรา (ค่าใช้งานจริง) | api = เสียเงินต่อเรื่อง | lite = TF-IDF+SVD บน CPU สำหรับ CI/ทดสอบเท่านั้น (คุณภาพต่ำ)
  lite_max_docs: 50000        # ถ้าใช้ lite กับคลังใหญ่กว่านี้ จะพิมพ์ WARNING (ผลคุณภาพต่ำ ไม่ควรเผยแพร่)
  api:                        # OpenAI-compatible POST {base_url}/embeddings — รันครั้งใหญ่ด้วย `uv run atlas embed -c config.yaml` (docs/OPERATIONS.md)
    base_url: https://api.openai.com/v1
    api_key_env: ATLAS_EMBED_API_KEY   # "ชื่อ" env var ที่เก็บ key — ตัว key อยู่ใน env var เท่านั้น ห้ามใส่ในไฟล์
    model: text-embedding-3-large
    dimensions: 1024          # ส่งให้ server เฉพาะเมื่อไม่ใช่ null (bge-m3: null — ได้ 1024 มิติเสมอ)
    store_id: null            # null → "api|<model>|<dimensions>" — ไม่ผูก base_url: ย้าย server ที่ให้ผลเท่ากันได้โดยไม่ต้อง embed ใหม่
    batch_size: 32            # เรื่องต่อ request สูงสุด
    max_batch_chars: 60000    # ตัวอักษรรวมต่อ request สูงสุด (ไทย ≈ 1 token/ตัวอักษร)
    concurrency: 4            # จำนวน request พร้อมกัน
    requests_per_minute: null # จำกัดอัตรา (null = ไม่จำกัด) — นับทุก request รวม retry และ batch ที่ถูกแบ่ง
    request_timeout: 120      # วินาทีต่อ request
    max_retries: null         # null = retry error ชั่วคราว (5xx/429/408/เน็ตหลุด) ไม่จำกัด; error ถาวร (401/403/404/400) หยุดทันที
    backoff_initial: 2        # วินาที — exponential backoff + full jitter
    backoff_max: 300          # รอนานสุดต่อครั้ง (Retry-After ของ server ก็ไม่เกินค่านี้)
    min_text_chars: 512       # server บอกว่าข้อความยาวเกิน → ตัดครึ่งซ้ำได้ แต่ไม่ต่ำกว่านี้
    checkpoint_every: 2000    # เขียนลง store ทุก N เรื่อง (ระหว่างนั้นอยู่ใน journal.bin — ปิดหน้าต่าง/ไฟดับก็ไม่หาย)
    lock_stale_seconds: 300   # ไม่มี heartbeat นานเกินนี้ → atlas status แสดง hung; lock ถูกยึดต่อเฉพาะเมื่อ process ตายแล้วเท่านั้น
    # ตัวอย่าง BGE-M3 (ตรวจ base_url/model กับผู้ให้บริการก่อนใช้ — check with your provider):
    #   self-hosted HF TEI / vLLM / Infinity / Ollama: base_url: http://host:port/v1   model: BAAI/bge-m3 (หรือ bge-m3)   dimensions: null
    #   DeepInfra:   base_url: https://api.deepinfra.com/v1/openai   model: BAAI/bge-m3   dimensions: null
    #   SiliconFlow: base_url: https://api.siliconflow.cn/v1         model: BAAI/bge-m3   dimensions: null
  local:                      # sentence-transformers บน GPU/CPU ของเราเอง
    model: BAAI/bge-m3
    device: cuda
    batch_size: 32
    fp16: true
    max_seq_length: 1024      # 512 ตัดบทคัดย่อไทยทิ้งเกือบหมด — BGE-M3 รองรับถึง 8192
    checkpoint_every: 5000
    lock_stale_seconds: 300   # ไม่มี heartbeat นานเกินนี้ → atlas status แสดง hung (ไม่ยึด lock ของ process ที่ยังอยู่)
  lite:
    dim: 128
    ngram_min: 2
    ngram_max: 4
    max_features: 100000
    min_df: 2
  doc_fields: [title_th, title_en, keywords_th, keywords_en, abstract_th, abstract_en]
  max_chars_per_doc: 6000

clustering:
  algorithm: hdbscan          # hdbscan (UMAP→HDBSCAN) | leiden (Leiden บน kNN graph — ต้อง uv sync --extra leiden)
  hdbscan_backend: fast       # fast | sklearn (fast_hdbscan เร็วกว่ามากที่ 500K — ต้อง uv sync --extra fast; sklearn ช้าแบบกำลังสอง ใช้กับคลังเล็กเท่านั้น; เปลี่ยนกลางทางทำให้กลุ่มต่างไป)
  leiden:
    k: 15                     # เพื่อนบ้านต่อบทความใน kNN graph
    resolution: 1.0           # สูง = หัวข้อเล็กลง/มากขึ้น
    min_cluster_size: 150     # community ที่เล็กกว่านี้ = ยังไม่จัดหมวด (−1)
    n_iterations: -1          # −1 = วนจนผลนิ่ง
  reducer: umap               # umap | pca
  pca_dims: 128               # ลดมิติด้วย PCA ก่อน UMAP เมื่อ embedding ใหญ่กว่านี้
  pca_fit_sample: 100000      # จำนวนบทความตัวอย่างที่ใช้ fit PCA
  umap_fit_sample: 150000     # fit UMAP บนตัวอย่างแล้ว transform ที่เหลือ (ประหยัด RAM ที่ 500K)
  fine:
    umap_n_components: 10
    umap_n_neighbors: 15
    umap_min_dist: 0.0
    hdbscan_min_cluster_size: 150
    hdbscan_min_samples: 20
  merge_similarity: 0.8       # รวม cluster ที่ centroid cosine ≥ ค่านี้ (แก้ HDBSCAN over-split)
  outlier_min_similarity: 0.35  # outlier เข้าหัวข้อเฉพาะเมื่อใกล้พอ ไม่งั้น "ยังไม่จัดหมวด"
  n_groups: 20                # จำนวนกลุ่มใหญ่บนแผนที่ (P1 จะเปลี่ยนเป็น OpenAlex fields)
  ctfidf_top_n: 20
  ctfidf_max_docs_per_topic: 400

labeling:
  provider: "off"             # llm | "off" (ต้องใส่เครื่องหมายคำพูด — YAML อ่าน off เปล่า ๆ เป็น false) — llm = ตั้งชื่อด้วย llm.tasks.label; off = จากคำสำคัญของผู้เขียน + c-TF-IDF
  overrides_path: ./registry/label_overrides.csv   # ชื่อที่บรรณาธิการแก้ (topic_id แบบ T000123) — ชนะชื่อจาก LLM ทุกรอบ; ไม่มีไฟล์ = ไม่มีการแก้
  n_repr_docs: 8              # บทความตัวแทน (ใกล้ centroid + กระจายด้วย MMR)
  mmr_lambda: 0.7
  reuse_min_jaccard: 0.5      # หัวข้อที่ lineage = continue ใช้ชื่อรอบก่อน (ไม่เรียก LLM) ถ้าคำสำคัญผู้เขียน + คำเด่น c-TF-IDF ยังทับซ้อนกับชุดคำตอนตั้งชื่อ ≥ ค่านี้ (Jaccard 0–1; 1 = ต้องเหมือนเดิมทุกคำ, 0 = ใช้ชื่อเดิมเสมอ); ชื่อจาก fallback คำสำคัญไม่ถูกใช้ต่อ, overrides ยังชนะ
  merge:                      # คู่หัวข้อที่อาจซ้ำ → ข้อเสนอให้บรรณาธิการ (ไม่รวมอัตโนมัติ)
    enabled: true
    min_similarity: 0.85      # centroid cosine ≥ ค่านี้ = ผู้สมัคร
    max_pairs: 30             # ส่งให้ LLM ตัดสินไม่เกินกี่คู่ (คู่ที่ใกล้ที่สุดก่อน; ใช้ llm.tasks.merge)

# ---------- คนตรวจ: atlas review export → CSV ให้บรรณาธิการสุ่มตรวจชื่อหัวข้อ ----------
review:
  sample_size: 50             # หัวข้อต่อรอบ (ชื่อจาก fallback + คู่ที่อาจซ้ำมาก่อน แล้วสุ่มที่เหลือแบบทำซ้ำได้)
  n_titles: 5                 # ตัวอย่างชื่อบทความต่อหัวข้อในไฟล์ตรวจ

# ---------- คำอธิบายหัวข้อ + บทสรุปผู้บริหาร (ตัวเลขมาจาก pipeline เท่านั้น — ตรวจซ้ำหลัง LLM ตอบ) ----------
narrative:
  provider: template          # llm (llm.tasks.narrative / brief) | template (ประโยคแม่แบบจากตัวเลข ไม่เรียก LLM)
  statuses: [EMERGING, HOT, DECLINING]   # สถานะที่ได้คำอธิบาย
  top_n: 10                   # ต่อสถานะ (EMERGING/HOT ตาม emerging_score, DECLINING ตามอัตราลดลง)
  n_titles: 5                 # ชื่อบทความตัวแทนที่ส่งให้ LLM
  brief: true                 # บทสรุปผู้บริหาร (headline ของหน้า Overview)

# ---------- LLM (ทุกงานผ่าน API แบบ OpenAI-compatible: POST {base_url}/chat/completions) ----------
llm:
  prompts_dir: null           # null = โฟลเดอร์ prompts/ ของ repo (ไฟล์ .md เป็นต้นฉบับเดียวของ prompt)
  budget_usd: null            # งบต่อรอบข้อมูล (USD) รวมทุกงาน — เกินงบ = หยุดอย่างสะอาด; เพิ่มงบแล้วรันซ้ำ = ทำต่อ (ต้องใส่ราคา)
  max_repairs: 2              # คำตอบไม่ใช่ JSON ตาม schema → ขอให้แก้ได้กี่ครั้ง
  max_regenerations: 1        # ข้อความไม่ผ่านการตรวจตัวเลข/ชื่อหัวข้อ → ให้เขียนใหม่ได้กี่ครั้ง (แล้วใช้ประโยคแม่แบบ)
  lock_stale_seconds: 300     # ไม่มี heartbeat นานเกินนี้ → atlas status แสดง hung (lock ของ process ที่ยังอยู่ไม่ถูกยึด)
  endpoints:
    default:
      base_url: ""            # เช่น https://openrouter.ai/api/v1 · https://api.opentyphoon.ai/v1 · http://localhost:8000/v1 (vLLM) — ว่าง = ยังไม่ตั้งค่า LLM
      api_key_env: ATLAS_LLM_API_KEY   # ชื่อ env var ที่เก็บ key (ห้ามใส่ key ในไฟล์) — ใช้ key เดียวกับ embedding ได้
      json_mode: true         # ส่ง response_format json_object (ปิดถ้า server ไม่รองรับ — โค้ดตรวจ JSON เองเสมอ)
      concurrency: 4
      request_timeout: 120
      max_retries: null       # null = server ล่ม/429 ลองใหม่ไม่จำกัด (backoff); key/model/URL/โควตาผิด = หยุดทันที (exit 2); ตั้งค่า = ครบแล้วหัวข้อนั้นใช้ fallback
      backoff_initial: 2
      backoff_max: 300
      price_per_mtok_in: null # USD ต่อ 1 ล้าน token ขาเข้า (ดูราคาของผู้ให้บริการ) — จำเป็นเมื่อตั้ง budget_usd
      price_per_mtok_out: null
  tasks:                      # model ว่าง = งานนั้นยังไม่ได้ตั้งค่า
    label:                    # ตั้งชื่อหัวข้อ (TH/EN)
      endpoint: default
      model: ""
      temperature: 0.2
      max_output_tokens: 600
    merge:                    # ตรวจคู่หัวข้อที่อาจซ้ำ (ข้อเสนอให้บรรณาธิการ — ไม่รวมอัตโนมัติ)
      endpoint: default
      model: ""
      temperature: 0.0
      max_output_tokens: 300
    narrative:                # คำอธิบายหัวข้อ emerging/hot/declining จากตัวเลขของ pipeline
      endpoint: default
      model: ""
      temperature: 0.3
      max_output_tokens: 900
    brief:                    # บทสรุปผู้บริหาร
      endpoint: default
      model: ""
      temperature: 0.3
      max_output_tokens: 1200
    methods:                  # บันทึกวิธีวิจัยต่อหัวข้อ (ใช้เมื่อ methods.provider: llm เท่านั้น)
      endpoint: default
      model: ""
      temperature: 0.2
      max_output_tokens: 500

# ---------- หัวข้อที่มี ID ถาวรข้ามรอบ (T000123) ----------
topics:
  mode: auto                  # auto | fit | assign — auto: assign ทุกไตรมาส, fit ใหม่เมื่อครบรอบ/โมเดล embedding เปลี่ยน/บทความใหม่หาที่ลงไม่ได้
  refit_every_releases: 4     # fit ใหม่อย่างน้อยทุก 4 รอบ (ปีละครั้ง)
  refit_max_unassigned: 0.15  # auto: บทความใหม่ > 15% ไม่ใกล้หัวข้อใดเลย → fit ใหม่
  match_containment: 0.5      # ตอน fit ใหม่ จับคู่หัวข้อเก่า↔ใหม่เมื่อบทความร่วม ≥ 50% (ฝั่งใดฝั่งหนึ่ง)
  match_min_shared: 5         # และมีบทความร่วมอย่างน้อยเท่านี้

# ---------- กลุ่มใหญ่ = OpenAlex fields (นิ่งข้ามรอบ + เทียบสากลได้) ----------
taxonomy:
  source: openalex            # openalex | off (off = ใช้กลุ่ม agglomerative ของ P0)
  reference_path: null        # ไฟล์งานอ้างอิง (.jsonl/.parquet/.csv) แบบ offline — null = ดึงจาก OpenAlex API แล้ว cache ใน state_dir
  openalex:
    base_url: https://api.openalex.org
    mailto: null              # อีเมลติดต่อ (ไม่บังคับ — ถ้าใส่จะส่งเป็นพารามิเตอร์ mailto)
    api_key_env: OPENALEX_API_KEY   # ไม่บังคับ — ชื่อ env var ของ API key (อ่านจาก env เท่านั้น ส่งทาง header Authorization: Bearer ไม่ใส่ใน URL/cache/log)
                              #   ไม่มี key: งบ $0.10/วัน, 10 req/s, อ่านหน้าแรกเท่านั้น | มี key (ฟรี): งบ $1/วัน, 30 req/s, อ่านหลายหน้าได้
                              #   งบวันหมด (429) → หยุดอย่างสุภาพ เก็บ cache ไว้ รันซ้ำพรุ่งนี้หรือตั้ง $OPENALEX_API_KEY แล้วรันต่อได้
    requests_per_second_keyless: 8   # ความเร็วสูงสุดเมื่อไม่มี key (ขีดจำกัดของ OpenAlex = 10)
    requests_per_second_keyed: 25    # ความเร็วสูงสุดเมื่อมี key (ขีดจำกัดของ OpenAlex = 30)
    max_pages_keyed: 1        # จำนวนหน้า (x per_subfield งาน) ต่อ subfield เมื่อมี key; ไม่มี key = 1 หน้าเสมอ
    country_code: TH          # งานที่มีผู้แต่งสังกัดประเทศนี้
    per_subfield: 100         # จำนวนงานตัวอย่างต่อ subfield (สูงสุด 100 = 1 request)
    seed: 42
    timeout: 30
    max_retries: 3
  k: 20                       # kNN: เพื่อนบ้านที่ใช้โหวต subfield
  max_articles_per_topic: 200 # บทความที่ใกล้ centroid ที่สุดที่ใช้โหวตต่อหัวข้อ
  min_vote_share: 0.5         # โหวตชนะ < 50% → cross_field
  holdout_frac: 0.2           # สัดส่วนงานอ้างอิงที่กันไว้วัดความแม่น kNN

# ---------- Emerging v3 — นิยามเต็มใน docs/EMERGING_SPEC.md ----------
emerging:
  definition_version: 4
  as_of_year: null            # ปีของ snapshot ที่ขั้น cluster บันทึกไว้ (null = ปีของวันที่รันขั้น cluster) — ปีที่กำลังดำเนินอยู่ไม่ถือว่าครบเสมอ
  min_year_complete: null     # null = backfill guard อัตโนมัติ (ตั้งเองได้ — มีผลเหนือกว่า guard)
  backfill_min_ratio: 0.6     # ปีที่ยอด < 60% ของ median ปีอ้างอิงก่อนหน้า ถือว่ายังไม่ครบ
  backfill_ref_years: 3       # จำนวนปีก่อนหน้าที่ใช้หา median อ้างอิง
  backfill_max_trim: 2        # ตัดปีที่ไม่ครบได้มากสุดกี่ปี
  recent_window: 3            # R
  baseline_window: 5          # B (ก่อน R)
  trend_window: 5             # W (ใช้วัดอัตราโตของ share ด้วย GLM)
  min_articles_recent: 30     # ต่ำกว่านี้ = LOW_DATA (ไม่ฟันธง)
  ci_level: 0.90              # ช่วงเชื่อมั่น: Student-t (df ของ GLM) เมื่อ overdispersed, normal เมื่อ φ = 1
  max_abs_log_growth: 10.0    # |log growth| หรือขอบช่วงเชื่อมั่นเกินนี้ (e^10 ≈ 22,000 เท่า/ปี) = ประมาณไม่ได้
  size:
    rule: quantile            # quantile | absolute
    large_quantile: 0.75      # "ใหญ่" = share_R ≥ quantile นี้ของหัวข้อที่จำแนกได้
    large_share: 0.015        # ใช้เมื่อ rule: absolute
  emerging:
    min_growth_lo: 0.10       # CI ล่างของอัตราโตของ share ≥ +10%/ปี
    min_share_ratio: 1.8      # share_R / share_B
  hot:
    min_growth_lo: 0.0        # หัวข้อใหญ่ที่ CI ล่าง > 0
  declining:
    max_growth_hi: 0.0        # CI บน < 0
    max_share_ratio: 0.8
  breadth:
    min_journals: 3           # ใน R ต้องมี ≥ 3 วารสาร
    min_orgs: 3               # และ ≥ 3 สถาบัน
    max_new_journal_share: 0.5  # บทความจากวารสารที่เพิ่งเข้าระบบใน R ต้อง < 50%
    min_org_coverage: 0.5     # ใช้เกณฑ์สถาบันเฉพาะเมื่อบทความใน R มีข้อมูลสังกัด ≥ 50% (กันข้อมูลตารางที่ไม่มีสังกัด)
    org_unit: institution     # (v4) นับสถาบันหลังรวมชื่อ (ตารางชื่อสถาบัน → ROR → ตามที่เขียน) ชุดเดียวกับหน้าสถาบัน; affiliation = นับตามชื่อสังกัดที่เขียน (v3)
  burst:
    s: 2.0                    # Kleinberg: อัตราในสถานะ burst = s × ปกติ
    gamma: 1.0                # ค่าเข้าสถานะ burst = γ·ln(T)
  score_weights:
    growth: 0.30
    acceleration: 0.20
    burst: 0.15
    novelty: 0.15
    coherence: 0.10
    breadth: 0.10

# ---------- Emerging keywords (ระดับคำสำคัญ — Carley/Porter) ----------
keywords:
  enabled: true
  min_docs_recent: 7          # อย่างน้อย 7 บทความในช่วง R
  max_doc_share: 0.15         # คำที่อยู่ใน > 15% ของบทความ = คำทั่วไป ตัดทิ้ง
  novelty_min_ratio: 2.0      # ใหม่: share ใน R ≥ 2 เท่าของช่วง B
  min_active_years: 3         # ปรากฏอย่างน้อย 3 ปีในช่วง W (นับจำนวนปีที่มีบทความ — ไม่จำเป็นต้องติดกัน)
  min_orgs: 3                 # ≥ 3 สถาบันในช่วง R
  min_journals: 3             # ≥ 3 วารสารในช่วง R (ไม่ผ่าน = journal_driven)
  max_new_journal_share: 0.5  # บทความจากวารสารที่เพิ่งเข้าระบบใน R ต้อง < 50%
  min_growth_lo: 0.0          # โตจริง: CI ล่างของอัตราโต share > ค่านี้
  max_terms: 50               # จำนวนคำสูงสุดที่ส่งออก
  smoothing_articles: 0.5     # ปรับสัดส่วนช่วงฐานด้วยบทความสมมติกี่เรื่อง (กันหารศูนย์ของคำใหม่) — มีผลต่อ novelty_min_ratio
  min_key_length: 2           # คำสำคัญที่สั้นกว่านี้ (หลังปรับรูป) ไม่นับ

# ---------- Forecast v2 — share × ยอดรวม corpus ----------
forecast:
  horizon: 2                  # พยากรณ์ล่วงหน้า 2 ปี
  min_history_years: 6        # หัวข้อที่มีประวัติน้อยกว่านี้ไม่พยากรณ์
  models: [naive, drift, nb_glm, ets_damped]   # naive = "เท่าปีล่าสุด" (baseline); ที่เหลือพยากรณ์ share × ยอดรวม
  total_models: [naive, drift, ets_damped]     # โมเดลพยากรณ์ยอดรวมทั้ง corpus
  cv_origins: 4               # rolling-origin backtest จาก 4 จุดตั้งต้น (≥ 3)
  min_train_years: 4          # จุดตั้งต้นต้องมีข้อมูลฝึกอย่างน้อยเท่านี้
  min_skill: 0.0              # แสดงตัวเลขเฉพาะเมื่อ skill เทียบ naive > ค่านี้ (ไม่งั้น "แนวโน้มไม่แน่นอน")
  max_mase: 1.0               # ... และ MASE < ค่านี้
  min_honest_points: 3        # ... และมีจุดทดสอบย้อนหลังแบบ honest อย่างน้อยเท่านี้ (หัวข้อประวัติสั้น 6 ปีมีแค่ 1 จุด → ไม่แสดง)
  dispersion_fallback: 0.1    # NB alpha (ความแปรปรวนเกิน Poisson) เมื่อ fit แนวโน้มของหัวข้อไม่ได้
  sigma_floor: 0.5            # ช่วงพยากรณ์ของจำนวนนับไม่แคบกว่า ± ค่านี้ (บทความ)
  alpha_min: 1.0e-6           # ขอบล่างของ NB alpha ที่ประมาณด้วย moments
  alpha_max: 10.0             # ขอบบน
  min_calibration: 20         # ค่าคลาดเคลื่อนจาก backtest อย่างน้อยเท่านี้ต่อ horizon จึงใช้ conformal (ไม่งั้นใช้ normal)
  nowcast:                    # ประมาณยอดทั้งปีของปีที่ยังไม่ครบ จากยอดสะสมตามเดือนตีพิมพ์
    enabled: true
    min_months: 3             # ต้องมีข้อมูลอย่างน้อย 3 เดือนแรกของปี
    profile_years: 3          # สัดส่วนรายเดือนจาก 3 ปีที่สมบูรณ์ล่าสุด
    as_of: null               # "YYYY-MM" ของปีที่ยังไม่ครบ — null = เดือนล่าสุดที่พบในปีนั้น (ไม่เกินเดือนปัจจุบัน)
    min_month_share: 0.02     # เดือนที่มีบทความน้อยกว่า 2% ของปีนั้น (เช่น ฉบับที่ลงวันที่ล่วงหน้า) ไม่นับเป็นเดือนล่าสุด

layout:
  umap_2d_neighbors: 12
  umap_2d_min_dist: 0.35
  view_w: 1680
  view_h: 1040
  edge_similarity_threshold: 0.55
  max_edges_per_node: 4
  stable: true                # วางแผนที่ต่อจากรอบก่อน (หัวข้อเดิมอยู่ที่เดิม)
  anchor: 0.9                 # 1 = หัวข้อเดิมอยู่ตำแหน่งเดิมทุกประการ, 0 = ตาม UMAP รอบนี้ (หลังจัดแนวแล้ว)
  init_neighbors: 3           # หัวข้อใหม่วางตามหัวข้อเดิมที่คล้ายที่สุด 3 หัวข้อ
  galaxy: true                # พิกัดบทความรอบหัวข้อ (work/09_galaxy)
  margin: 90                  # ขอบเว้นรอบแผนที่ (พิกเซลของ view_w × view_h) ที่หัวข้อไม่ล้ำเข้าไป

# ---------- P2 บรรณาธิการ: วารสาร (ระดับวารสาร/สถาบันเท่านั้น — ไม่มีข้อมูลรายบุคคล) ----------
journals:
  registry_path: ../corpus/journals.csv   # ไม่บังคับ: ชื่อเต็ม/ISSN/tier/สถาบันเจ้าของ (คอลัมน์ดู registry/journals.example.csv) — คลังรูปแบบ 1.0 ส่ง journals.csv มาพร้อมกัน; คลัง .md ใช้ ./registry/journals.csv — ไม่มีไฟล์ = แสดงชื่อ OJS
  window_years: 5             # ตัวชี้วัดวารสารคิดจาก 5 ปีล่าสุดที่ข้อมูลครบ
  min_articles: 20            # วารสารที่มีบทความในช่วงนั้น < 20 เรื่อง → ไม่คำนวณสัดส่วน (ข้อมูลน้อย)
  completeness_weights:       # D2 คะแนนความครบถ้วน metadata 0–100 = ค่าเฉลี่ยถ่วงน้ำหนักของอัตราต่อองค์ประกอบ (ไม่ใช่ผลประเมิน TCI ทางการ)
    abstract_en: 0.20         # มีบทคัดย่อภาษาอังกฤษ
    title_en: 0.10            # มีชื่อเรื่องภาษาอังกฤษ
    keywords_en: 0.15         # มีคำสำคัญภาษาอังกฤษ
    doi: 0.20                 # มี DOI
    references: 0.15          # มีรายการอ้างอิง (ไม่ใช่มีแค่ "วิธีอ้างอิงบทความนี้")
    refs_romanized: 0.10      # บทความที่อ้างเอกสารภาษาไทย มีรายการอ้างอิงแปลเป็นภาษาอังกฤษ (Translated Thai References)
    affiliations: 0.10        # ผู้แต่งทุกคนระบุสังกัด
  inhouse_flag_share: null    # เว็บทำเครื่องหมายวารสารที่สัดส่วนบทความจากสถาบันเจ้าของ > ค่านี้ เฉพาะวารสารที่ registry ระบุสถาบันเจ้าของ (ใส่ตามเกณฑ์ TCI รอบปัจจุบัน) — null = ไม่ทำเครื่องหมาย
  owner_min_share: 0.2        # ไม่มีสถาบันเจ้าของใน registry → อนุมานจากสถาบันที่พบบ่อยที่สุด (ติดป้าย "อนุมาน") เฉพาะเมื่อพบใน ≥ 20% ของบทความ
  peers_k: 8                  # D4 วารสารคู่เทียบสูงสุดต่อวารสาร
  peers_min_similarity: 0.2   # cosine ของสัดส่วนหัวข้อ ≥ ค่านี้
  top_topics: 15              # หัวข้อที่แสดงต่อวารสาร
  drift_reference_years: 3    # D1 scope drift: เทียบสัดส่วนหัวข้อของแต่ละปีกับ 3 ปีก่อนหน้า (Jensen–Shannon distance 0–1)
  drift_min_articles: 10      # ปีที่มีบทความ < 10 เรื่อง (หรือช่วงอ้างอิง < 10) ไม่คำนวณ drift
  shift_topics: 5             # หัวข้อที่สัดส่วนเพิ่ม/ลดมากที่สุด (ช่วง R เทียบช่วง B ของ emerging) ที่แสดงต่อวารสาร
  year_mix_topics: 4          # สัดส่วนหัวข้อรายปี: หัวข้อใหญ่สุดของวารสารกี่หัวข้อ (0–4; 0 = ไม่เผยแพร่) — ที่เหลือรวมเป็น "อื่น ๆ"
  year_mix_min_articles: 10   # ปีที่วารสารมีบทความเข้าหัวข้อ < 10 เรื่อง ไม่คิดสัดส่วน (เว้นว่าง ไม่ใช่ศูนย์)
  special_issue_statuses: [EMERGING, WATCH]   # D5 สถานะหัวข้อที่อาจเปิดฉบับพิเศษ
  special_issue_min_host_articles: 3   # วารสารที่ตีพิมพ์หัวข้อนั้น ≥ 3 เรื่องในช่วง R = "รองรับ" หัวข้อนั้น
  special_issue_max_hosts: 5  # หัวข้อที่มีวารสารรองรับ ≤ 5 วารสาร = โอกาสฉบับพิเศษ
  special_issue_per_journal: 5   # จำนวนโอกาสที่แสดงต่อวารสาร
  scope_topics: 5             # หัวข้อที่ติดกับ (edge บนแผนที่) หัวข้อหลัก 5 อันดับแรกของวารสาร = "ใกล้ขอบเขต"

# ---------- P2 วิธีวิจัย (คลังคำ TH/EN + ขนาดตัวอย่าง; เผยแพร่ระดับหัวข้อ/วารสารเท่านั้น) ----------
methods:
  enabled: true
  window_years: 5             # สัดส่วนวิธีวิจัยของหัวข้อคิดจาก 5 ปีล่าสุดที่ข้อมูลครบ
  min_articles: 30            # หัวข้อที่มีบทความในช่วงนั้น < 30 เรื่อง ไม่แสดงในหน้า /methods
  max_sample_size: 1000000    # ขนาดตัวอย่างที่อ่านได้เกินนี้ = อ่านผิด ไม่นับ
  monoculture_methods: [survey, descriptive_stats]   # E11 "วิธีวิจัยกระจุก": บทความที่ใช้เฉพาะวิธีในชุดนี้ (แบบสอบถาม + สถิติพรรณนา)
  monoculture_min_share: 0.6  # หัวข้อที่บทความแบบนั้น ≥ 60% ของบทความที่ระบุวิธีได้ = ติดป้าย
  provider: "off"             # llm = เขียนบันทึกวิธีวิจัยต่อหัวข้อด้วย llm.tasks.methods (ระดับหัวข้อเท่านั้น ไม่เรียกต่อบทความ); off = ไม่มีบันทึก
  note_top_n: 50              # หัวข้อที่ได้บันทึก (หัวข้อใหญ่ก่อน)

# ---------- P2 "วางบทคัดย่อของฉัน" + "ควรตีพิมพ์ที่ไหน" (คำนวณในเบราว์เซอร์ ไม่ส่งข้อความออกนอกเครื่อง) ----------
match:
  enabled: false              # ปิดตั้งแต่ปรับเว็บเป็นแดชบอร์ด (2026-10-24): เว็บไม่มีหน้า "วางบทคัดย่อ" แล้ว — true = สร้าง match.json เหมือนเดิม
  docs_per_topic: 100         # บทความต่อหัวข้อที่ใช้สร้าง term vector (สุ่มแบบคงที่ด้วย pipeline.seed)
  abstract_chars: 600         # ใช้บทคัดย่อ TH/EN ส่วนต้นกี่ตัวอักษร (ข้อความไม่ถูกเผยแพร่ — เผยแพร่เฉพาะน้ำหนักของชิ้นอักษร 3 ตัว)
  min_df: 3                   # ชิ้นอักษรที่พบในบทความ < 3 เรื่อง ไม่ใช้
  max_terms: 150              # ชิ้นอักษรสูงสุดต่อหัวข้อ
  min_terms: 30               # ลดลงได้ถึงเท่านี้เมื่อไฟล์ใหญ่เกิน max_bytes
  max_bytes: 5000000          # ขนาดสูงสุดของ match.json
  min_similarity: 0.05        # หัวข้อที่ cosine < ค่านี้ไม่แสดง
  fit_topics: 5               # R4 ควรตีพิมพ์ที่ไหน: ใช้ 5 หัวข้อที่ใกล้ที่สุด × สัดส่วนหัวข้อของวารสาร
  journal_topics: 20          # หัวข้อสูงสุดต่อวารสารในดัชนี
  journal_min_share: 0.02     # ...เฉพาะหัวข้อที่เป็น ≥ 2% ของบทความวารสารในช่วง journals.window_years
  min_query_chars: 40         # ข้อความที่วางต้องยาวอย่างน้อยเท่านี้ (หลังตัดช่องว่าง)

# ---------- P2 อะไรเปลี่ยนตั้งแต่รอบก่อน (diff.json, หน้า /changes) ----------
changes:
  movers: 10                  # หัวข้อที่สัดส่วนช่วง R เปลี่ยนมากที่สุด
  min_share_delta: 0.0005     # เปลี่ยน < 0.05 จุดร้อยละ ไม่นับเป็น mover

# ---------- P3 ผู้บริหาร: สถาบัน เครือข่ายความร่วมมือ จังหวัด (ระดับสถาบันเท่านั้น — ไม่มีข้อมูลรายบุคคล) ----------
institutions:
  enabled: true
  aliases_path: ./registry/institutions_aliases.csv   # ไม่บังคับ: ตารางชื่อสถาบันที่คัดเอง (คอลัมน์ดู registry/institutions_aliases.example.csv) — วิทยาเขต/ชื่อย่อของราชภัฏ ราชมงคล ฯลฯ → มหาวิทยาลัยเดียว
  ror_path: null              # ไม่บังคับ: ไฟล์ ROR data dump (.json หรือ .zip, CC0) ที่ดาวน์โหลดไว้ในเครื่อง — null = ไม่จับคู่กับ ROR
  population_path: ./registry/province_population.csv   # ไม่บังคับ: code,population,year (เช่น สถิติทะเบียนราษฎร) → บทความต่อประชากรแสนคน
  alias_min_chars: 4          # ชื่อในตารางที่สั้นกว่านี้ (หลังตัดวรรณยุกต์/ช่องว่าง/จุด) ไม่รับ — กันจับผิดสถาบัน
  province_from_name: true    # สถาบันที่ไม่อยู่ในตาราง/ROR → อนุมานจังหวัดจากชื่อจังหวัดในสังกัด (ติดป้าย "ตามที่เขียนในบทความ")
  window_years: 5             # ตัวชี้วัดสถาบัน/จังหวัด/เครือข่ายคิดจาก 5 ปีล่าสุดที่ข้อมูลครบ
  min_articles: 5             # สถาบันที่มีบทความในช่วงนั้น < 5 เรื่อง ถูกนับรวม แต่ไม่แสดงเป็นรายการ/หน้า/คู่ความร่วมมือ
  network_min_articles: 3     # คู่สถาบันต้องมีบทความร่วมกัน ≥ 3 เรื่องจึงแสดง
  network_max_edges: 300      # คู่ความร่วมมือที่แสดงสูงสุด (เรียงจากบทความร่วมมากไปน้อย)
  top_topics: 15              # หัวข้อที่แสดงต่อสถาบัน
  province_topics: 5          # หัวข้อใหญ่ที่สุดต่อจังหวัด (หน้า "งานวิจัยในจังหวัดของฉัน"); 0 = ไม่เผยแพร่
  max_partners: 15            # สถาบันคู่ความร่วมมือ/ประเทศที่แสดงต่อสถาบัน
  suggest_k: 5                # R6 สถาบันที่อาจร่วมงานได้ ต่อสถาบัน
  suggest_min_similarity: 0.3 # ...สัดส่วนหัวข้อคล้ายกัน (cosine) ≥ ค่านี้ และยังไม่มีบทความร่วมกันในช่วงนั้น

risk:                         # E10 ความเสี่ยงการกระจุกตัว (บทความช่วงล่าสุด R ของ emerging)
  min_articles: 30            # ประเมินเฉพาะหัวข้อ/สาขาที่มีบทความ ≥ 30 เรื่อง
  max_top_share: 0.5          # สถาบัน/วารสารรายใหญ่สุดอยู่ใน ≥ 50% ของบทความ = กระจุกตัว
  max_hhi: 0.25               # หรือ HHI (ผลรวมกำลังสองของสัดส่วน) ≥ 0.25 = กระจุกตัว

gaps:                         # R5 ตัวหาช่องว่างงานวิจัย
  statuses: [EMERGING, WATCH] # สถานะหัวข้อที่ตรวจ "สถาบันทำน้อย"
  max_institutions: 5         # มีสถาบันทำ ≤ 5 แห่งในช่วงล่าสุด = สถาบันทำน้อย
  bridge_min_similarity: 0.6  # หัวข้อเพื่อนบ้าน = เส้นเชื่อมบนแผนที่ที่ความคล้าย ≥ ค่านี้
  bridge_max_jaccard: 0.1     # ...และชุดสถาบันที่ทำซ้อนกัน (Jaccard) ≤ ค่านี้ = ยังไม่ค่อยมีใครเชื่อม
  max_items: 30               # รายการสูงสุดต่อหมวด

sdg:                          # E8 SDG 17 เป้า + กรอบไทย (BCG / แผนด้าน ววน. / หมุดหมายแผนฯ 13) ระดับหัวข้อ
  enabled: true
  frameworks_path: null       # null = atlas/data/frameworks.yaml ที่มากับโค้ด (แก้คำสำคัญได้) — หรือชี้ไปไฟล์ YAML ของผู้ดูแล
  method: lexical             # lexical = นับคำสำคัญ (ค่าเริ่ม) | embedding/auto = ความคล้ายของ centroid หัวข้อ — ใช้หลังปรับ min_similarity กับข้อมูลจริงแล้วเท่านั้น
  min_similarity: 0.45        # embedding: cosine ≥ ค่านี้ (ปรับตามโมเดล)
  min_article_share: 0.15     # lexical: บทความของหัวข้อที่ชื่อเรื่อง/คำสำคัญมีคำของเป้าหมาย ≥ 15%
  max_goals_per_topic: 3      # เป้าหมายสูงสุดต่อหัวข้อ ต่อกรอบ
  docs_per_topic: 400         # lexical: สุ่มบทความต่อหัวข้อ (คงที่ด้วย pipeline.seed)

benchmark:                    # E9 ไทยเทียบโลก (OpenAlex ผ่าน taxonomy.openalex: base_url, api_key_env, country_code)
  enabled: true               # false = ไม่เรียก OpenAlex (หน้า /global บอกเหตุผล)
  min_world_works: 1000       # subfield ที่มีงานทั้งโลกช่วงล่าสุด < 1,000 เรื่อง ไม่นับเป็นโอกาส
  min_world_ratio: 1.2        # โลกโต: สัดส่วนของ subfield ในงานทั้งโลก ช่วงล่าสุด ÷ ช่วงฐาน ≥ 1.2
  max_activity_index: 0.5     # ไทยยังเล็ก: ดัชนีความเข้มข้น (สัดส่วนในงานไทย ÷ สัดส่วนในงานโลก) ≤ 0.5

references:                   # D7 แนวปฏิบัติการอ้างอิงรายวารสาร + R12 "ถูกอ้างใน TCI" (P4) — นับเฉพาะรายการอ้างอิงที่ไม่ใช่การอ้างตัวเองและไม่ใช่ฉบับแปลซ้ำ
  enabled: true               # false = ไม่ทำโมดูลการอ้างอิง (หน้า /references บอกเหตุผล)
  min_coverage: 0.5           # เผยแพร่เมื่อบทความในช่วงที่วิเคราะห์ ≥ 50% มีรายการอ้างอิงที่อ่านได้ (ไม่ถึง → ข้ามพร้อมตัวเลข coverage)
  min_journal_articles: 20    # แสดงวารสารที่มีบทความที่มีรายการอ้างอิง ≥ 20 เรื่อง
  recent_years: 5             # อ้างอิง "ใหม่" = อายุ (ปีบทความ − ปีที่อ้าง) ≤ 5 ปี
  min_title_chars: 15         # จับคู่ชื่อเรื่องเมื่อชื่อที่ normalise แล้วยาว ≥ 15 ตัวอักษร (ชื่อซ้ำกันหลายบทความไม่จับคู่)
  min_internal_matches: 20    # จับคู่การอ้างอิงภายในคลังได้ < 20 รายการ → ไม่เผยแพร่ส่วน "ถูกอ้างใน TCI" (บอกเหตุผล)
  min_flow: 3                 # แสดงการอ้างอิงข้ามหัวข้อ (หัวข้อ → หัวข้อ) ที่มี ≥ 3 ครั้ง
  top_articles: 50            # บทความที่ถูกอ้างในคลังมากที่สุด (ชื่อเรื่อง วารสาร ปี ลิงก์ — ไม่มีชื่อผู้แต่ง)

search:                       # R2 ค้นหาบทความทั้งคลัง (ดัชนีแบบสถิตแบ่งไฟล์ จากชื่อเรื่อง + คำสำคัญของผู้แต่ง — ไม่มีบทคัดย่อ ไม่มีชื่อผู้แต่ง) + R8 จุดบทความในกาแล็กซี (P4)
  enabled: true               # false = ไม่ทำแถวบทความและกาแล็กซี (หน้า /galaxy บอกเหตุผล); กาแล็กซีต้องมี layout.galaxy: true ด้วย
  word_index: false           # ดัชนีคำ (search/vocab.json + search/idx-*.json) ของหน้าค้นหาบทความเดิม — เว็บไม่มีกล่องค้นหาแล้ว จึงปิด; meta.json + docs-*.json (แถวบทความของกาแล็กซี) ยังสร้างเสมอ
  index_shards: 64            # จำนวนไฟล์ดัชนี search/idx-<NNN>.json — คำไปอยู่ไฟล์ fnv1a32(คำ) % 64 (เบราว์เซอร์โหลดเฉพาะไฟล์ของคำที่ค้น)
  docs_per_shard: 2000        # บทความต่อไฟล์ search/docs-<NNN>.json (ลำดับบทความเรียงตาม article_id)
  min_df: 1                   # คำที่พบในบทความน้อยกว่านี้ไม่เข้าดัชนี (1 = ทุกคำ)
  max_token_chars: 24         # คำยาวสุดที่เข้าดัชนี และความยาวสูงสุดที่ใช้จับคู่คำไทยแบบยาวที่สุดก่อนตอนค้น
  max_results: 500            # ผลค้นหาที่หน้าเว็บแสดงสูงสุด

kwtrends:                     # R7 แนวโน้มคำสำคัญของผู้แต่ง (ไทยและอังกฤษแยกกัน ปรับรูปแบบเดียวกับ keywords) + อภิธานศัพท์ไทย↔อังกฤษ (P4)
  enabled: true               # false = ไม่ทำแนวโน้มคำสำคัญและอภิธานศัพท์ (หน้า /keywords บอกเหตุผล)
  max_keywords: 3000          # เผยแพร่คำสำคัญสูงสุด 3,000 คำ (เรียงตามจำนวนบทความรวมในช่วงปีของอนุกรมเวลา)
  min_count: 5                # คำที่อยู่ในบทความรวม < 5 เรื่องในช่วงปีของอนุกรมเวลา ไม่เผยแพร่
  glossary_per_topic: 15      # คู่คำไทย↔อังกฤษที่แสดงต่อหัวข้อ (จับคู่ตามตำแหน่งเมื่อรายการคำสำคัญไทยและอังกฤษยาวเท่ากัน)
  glossary_min_pairs: 2       # คู่คำที่พบในบทความ < 2 เรื่อง ไม่แสดง
  glossary_max: 2000          # คู่คำในอภิธานศัพท์รวมทั้งคลัง (kwtrends.json) สูงสุด

export:
  formats: [json, csv]
  include_forecast_in_json: true
  v2: true                    # เขียน data contract v2 → output/data/<release>/ (+ atlas_data.json 1.1 เหมือนเดิม)
  repr_articles: 12           # บทความตัวแทนต่อหัวข้อ (ชื่อเรื่อง + ลิงก์ ThaiJO — ไม่เผยแพร่บทคัดย่อ)
  max_topic_journals: 10
  max_topic_orgs: 10
  max_neighbors: 6
  offline_max_mb: 60          # ขนาดสูงสุดของ atlas-offline.html: ไฟล์รายละเอียดหัวข้อ → วารสาร → สถาบัน ใส่จนเต็ม (หน้าที่ไม่มีไฟล์จะบอกผู้อ่าน)
  offline_exclude: [match.json, search, galaxy.json]   # ไฟล์/โฟลเดอร์ที่ไม่ใส่ใน HTML เดี่ยว (atlas-offline.html) — หน้า /match /search /galaxy ในไฟล์ offline บอกให้ใช้เว็บออนไลน์

publish:                      # atlas publish --site (P4)
  site_url: null              # ที่อยู่สาธารณะของเว็บ เช่น https://<user>.github.io/<repo>/ — ตั้งแล้วจึงเขียนฟีด Atom (data/feeds/releases.xml + data/feeds/topics/<รหัสหัวข้อ>.xml); null = ไม่เขียนฟีด
  feed_max_entries: 12        # จำนวนรอบข้อมูลสูงสุดต่อฟีด (ใหม่สุดก่อน)
  keep_full_releases: 1       # รอบที่เก็บครบบนเว็บ (ใหม่สุดก่อน) รอบเก่ากว่าเก็บเฉพาะ manifest/overview/topics/taxonomy/diff (หลาย MB ไม่ใช่หลายร้อย MB)

# ---------- atlas validate: เทียบกับรอบก่อน ----------
validation:
  max_topic_count_change: 0.25  # จำนวนหัวข้อเปลี่ยน > 25% → warning
  min_kept_ids: 0.9           # ID หัวข้อรอบก่อนที่ยังอยู่ < 90% → warning
  max_status_change_frac: 0.3 # หัวข้อเดิมที่เปลี่ยนสถานะ > 30% → warning
  size_swing_ratio: 2.0       # ขนาดหัวข้อเปลี่ยน ≥ 2 เท่า (ขึ้นหรือลง) → warning
  size_swing_min_articles: 50 # ...เฉพาะหัวข้อที่มี ≥ 50 บทความ
  max_article_drop: 0.02      # บทความทั้งหมดลดลง > 2% → error
  max_file_bytes: 50000000    # ไฟล์ใดใหญ่กว่า 50MB → warning (GitHub Pages รับไฟล์ละไม่เกิน 100MB)
  privacy_allow: []           # ชื่อหน่วยงานที่คนตรวจแล้วว่าไม่ใช่ชื่อบุคคล แต่ด่านความเป็นส่วนตัวทักเพราะบังเอิญตรงกับชื่อผู้แต่ง (ใส่ตามตัวอักษรที่ error แสดง)

# ---------- atlas bakeoff: เทียบ embedding/clustering ด้วยตัวเลข ----------
bakeoff:
  sample: 5000                # จำนวนบทความตัวอย่าง
  k: 10                       # kNN สำหรับวัดความแม่น
  holdout_frac: 0.2
  seeds: [1, 2, 3]            # วัดความนิ่ง (ARI) ข้าม seed
  algorithms: [hdbscan, hdbscan_fast, leiden]   # hdbscan_fast ต้อง --extra fast, leiden ต้อง --extra leiden
  npmi_top_n: 10
  embedding_candidates: []    # เช่น - {name: bge-m3-api, provider: api, model: BAAI/bge-m3, base_url: https://…/v1}
                              #      - {name: 3-large, provider: api, model: text-embedding-3-large, dimensions: 1024}
                              #      (api ใช้ runner ของ P0 — แยก store ต่อโมเดลด้วย store_id อัตโนมัติ)
